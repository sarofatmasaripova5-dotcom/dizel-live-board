<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dizel Live Board</title><style>body{font:16px system-ui;margin:0;background:#f1f5f9;color:#0f172a}header{background:#12355b;color:white;padding:14px}main{padding:12px;max-width:1300px;margin:auto}.card{background:white;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0001}button,input,select{font:inherit;padding:9px;border:1px solid #94a3b8;border-radius:8px;max-width:100%}button{background:#1d4ed8;color:white;border:0;cursor:pointer;margin:3px}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}.student{background:white;border:1px solid #cbd5e1;border-radius:10px;padding:10px;cursor:pointer}.student.active{outline:3px solid #2563eb}.student small{display:block}canvas{width:100%;height:330px;touch-action:none;background:white;border:2px solid #94a3b8;border-radius:8px}label{display:block;margin:7px 0}.muted{color:#64748b}#workspace{display:none}#teacherPanel{display:none}#login{max-width:460px;margin:25px auto}#status{font-weight:600}#comment{white-space:pre-wrap}#taskText{font-size:18px;font-weight:650}</style><header><b>Dizel Live Board V4</b> — 16 talaba uchun jonli doska <span id="status"></span></header><main><section class="card" id="login"><h2>Kirish</h2><label>Rol <select id="role"><option value="student">Talaba</option><option value="teacher">O‘qituvchi</option></select></label><label>Kirish kodi <input id="code" type="password" autocomplete="off"></label><label id="studentPick">Talaba <select id="student"></select></label><button onclick="connect()">Kirish</button><p class="muted">O‘qituvchi kodi va sinf kodi Render → Environment bo‘limida saqlanadi.</p></section><section id="workspace"><section id="teacherPanel"><h3>16 talaba — jonli nazorat</h3><div class="card"><label>Umumiy masala <select id="globalTask" onchange="send({type:'global_task',task:+this.value})"></select></label><button onclick="exportCsv()">Natijalarni CSV olish</button></div><div class="grid" id="grid"></div></section><div class="card"><h3 id="personTitle">Mening doskam</h3><p id="taskText"></p><div id="teacherControls" hidden><label>Shaxsiy masala <select id="privateTask" onchange="send({type:'task',student:selected,task:this.value===''?null:+this.value})"></select></label><label>O‘qituvchi izohi <input id="commentInput" placeholder="Izoh"></label><button onclick="send({type:'comment',student:selected,value:document.getElementById('commentInput').value})">Izoh yuborish</button><label>Baho (0–10) <input id="gradeInput" type="number" min="0" max="10" step="0.5"></label><button onclick="send({type:'grade',student:selected,value:+document.getElementById('gradeInput').value})">Baholash</button><button onclick="send({type:'clear_teacher',student:selected})">Qizil yozuvni tozalash</button></div><canvas id="canvas"></canvas><button id="clearStudent" onclick="send({type:'clear'})">Doskani tozalash</button><p id="comment"></p><div id="studentAnswer"><label>Sonli javob <input id="answer" inputmode="decimal"></label><button onclick="send({type:'answer',value:document.getElementById('answer').value})">Javobni yuborish</button></div><p id="grade"></p></div></section></main><script>
const $=id=>document.getElementById(id);let ws,role,me=-1,selected=0,boards=[],tasks=[],globalTask=0,teacherCode='',draw=false,points=[];const names=["ABDULLAYEV IN'OMJON","AZIMBAYEV FURQAT","BAXITOV AYBEK","BOLTAYEV ERGASH","EGAMOV ALISHER","ISMOILOV DIYDORBEK","KALANDAROV NOSIR","MURATOV TOXIRJON","RAJABOV NAVRO‘ZBEK","RAXIMOV RUSTAMBEK","SAFOYEV SIROJBEK","SAIDOV SHOHRUH","SHARIPOV UMRBEK","TURIMBETOVA SARBINAZ","XALILLAYEV SHAHRIYOR","YUREV MUNISBEK"];names.forEach((n,i)=>$('student').add(new Option(n,i)));$('role').onchange=()=>$('studentPick').hidden=$('role').value==='teacher';function send(x){if(ws?.readyState===1)ws.send(JSON.stringify(x))}function connect(){role=$('role').value;me=+$('student').value;teacherCode=$('code').value;ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.onopen=()=>send({role,code:teacherCode,student:me});ws.onclose=()=>$('status').textContent=' — aloqa uzildi, sahifani yangilang';ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='error'){alert(m.message);return}handle(m)}}function handle(m){if(m.type==='init'){tasks=m.tasks;globalTask=m.global_task;boards=m.boards||Array.from({length:16},()=>({strokes:[],teacher_strokes:[],task:null,answer:'',grade:null,comment:'',online:false}));if(role==='student')boards[me]=m.board;$('login').hidden=true;$('workspace').style.display='block';$('teacherPanel').style.display=role==='teacher'?'block':'none';$('teacherControls').hidden=role!=='teacher';$('clearStudent').hidden=role==='teacher';$('studentAnswer').hidden=role==='teacher';$('status').textContent=' — ulandi';$('globalTask').innerHTML=tasks.map((t,i)=>'<option value="'+i+'">Masala '+(i+1)+'</option>').join('');$('privateTask').innerHTML='<option value="">Umumiy masala</option>'+tasks.map((t,i)=>'<option value="'+i+'">Masala '+(i+1)+'</option>').join('');render();return}if(m.type==='presence'){m.online.forEach((v,i)=>boards[i].online=v)}if(m.type==='global_task')globalTask=m.task;if(m.student!==undefined){let b=boards[m.student];if(m.type==='stroke')b[m.layer==='teacher'?'teacher_strokes':'strokes'].push(m.points);if(m.type==='clear')b[m.layer==='teacher'?'teacher_strokes':'strokes']=[];if(m.type==='answer')b.answer=m.value;if(m.type==='task')b.task=m.task;if(m.type==='comment')b.comment=m.value;if(m.type==='grade')b.grade=m.value}render()}function render(){if(role==='teacher'){$('grid').innerHTML=names.map((n,i)=>'<div class="student '+(selected===i?'active':'')+'" onclick="selectStudent('+i+')"><b>'+(i+1)+'. '+n+'</b><small>'+(boards[i].online?'🟢 Online':'⚪ Offline')+'</small><small>Javob: '+escapeHtml(boards[i].answer||'—')+'</small><small>Baho: '+(boards[i].grade??'—')+'</small></div>').join('');$('globalTask').value=globalTask}$('personTitle').textContent=role==='teacher'?names[selected]:'Mening doskam';let b=boards[role==='teacher'?selected:me];if(!b)return;let k=b.task??globalTask;$('taskText').textContent='Masala '+(k+1)+': '+tasks[k];$('comment').textContent=b.comment?'O‘qituvchi: '+b.comment:'';$('grade').textContent=b.grade!==null?'Baho: '+b.grade+'/10':'';if(role==='teacher'){$('privateTask').value=b.task??'';$('commentInput').value=b.comment;$('gradeInput').value=b.grade??''}else{$('answer').value=b.answer}paint()}function selectStudent(i){selected=i;render()}function exportCsv(){location.href='/export?code='+encodeURIComponent(teacherCode)}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const canvas=$('canvas'),ctx=canvas.getContext('2d');function resize(){const r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*devicePixelRatio);canvas.height=Math.round(r.height*devicePixelRatio);paint()}window.addEventListener('resize',resize);function line(pts,color){if(!pts?.length)return;ctx.strokeStyle=color;ctx.lineWidth=3*devicePixelRatio;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x*canvas.width,y*canvas.height):ctx.moveTo(x*canvas.width,y*canvas.height));if(pts.length===1)ctx.lineTo(pts[0][0]*canvas.width+.1,pts[0][1]*canvas.height+.1);ctx.stroke()}function paint(){const r=canvas.getBoundingClientRect();if(!r.width)return;if(canvas.width!==Math.round(r.width*devicePixelRatio)){resize();return}ctx.clearRect(0,0,canvas.width,canvas.height);let b=boards[role==='teacher'?selected:me];if(!b)return;b.strokes.forEach(p=>line(p,'#1d4ed8'));b.teacher_strokes.forEach(p=>line(p,'#dc2626'));if(draw)line(points,role==='teacher'?'#dc2626':'#1d4ed8')}function pos(e){let r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}canvas.onpointerdown=e=>{if(!ws||ws.readyState!==1)return;canvas.setPointerCapture(e.pointerId);draw=true;points=[pos(e)];paint()};canvas.onpointermove=e=>{if(!draw)return;points.push(pos(e));if(points.length>500)points.shift();paint()};canvas.onpointerup=e=>{if(!draw)return;draw=false;points.push(pos(e));send({type:'stroke',student:selected,points});points=[];paint()};canvas.onpointercancel=()=>{draw=false;points=[];paint()};</script></html>
